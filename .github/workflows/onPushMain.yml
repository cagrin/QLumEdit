name: Just build

on:
  push:
    branches:
      - main

env:
  QT_VERSION: 6.12.0

jobs:
  build-on-ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_HOST: linux
      QT_ARCH: linux_gcc_64
      QT_SPEC: gcc_64
    steps:
      - uses: actions/checkout@master
      - name: Install aqt
        run: pip install aqtinstall
      - name: Install QT
        run: |
          aqt list-qt ${{env.QT_HOST}} desktop --arch ${{env.QT_VERSION}}
          aqt install-qt ${{env.QT_HOST}} desktop ${{env.QT_VERSION}} ${{env.QT_ARCH}}
      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install libgl1-mesa-dev ninja-build
      - name: Try to build
        env:
          CMAKE_PREFIX_PATH: ${{github.workspace}}/${{env.QT_VERSION}}/${{env.QT_SPEC}}
        run: cmake --workflow --preset build
  build-on-macos-latest:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      QT_HOST: mac
      QT_ARCH: clang_64
      QT_SPEC: macos
    steps:
      - uses: actions/checkout@master
      - name: Install aqt
        run: pip install aqtinstall
      - name: Install QT
        run: |
          aqt list-qt ${{env.QT_HOST}} desktop --arch ${{env.QT_VERSION}}
          aqt install-qt ${{env.QT_HOST}} desktop ${{env.QT_VERSION}} ${{env.QT_ARCH}}
      - name: Install Prerequisites
        run: brew install ninja
      - name: Try to build
        env:
          CMAKE_PREFIX_PATH: ${{github.workspace}}/${{env.QT_VERSION}}/${{env.QT_SPEC}}
        run: cmake --workflow --preset build
  build-on-windows-latest:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_HOST: windows
      QT_ARCH: win64_msvc2022_64
      QT_SPEC: msvc2022_64
    steps:
      - uses: actions/checkout@master
      - name: Install aqt
        run: pip install git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7
      - name: Install QT
        run: |
          aqt list-qt ${{env.QT_HOST}} desktop --arch ${{env.QT_VERSION}}
          aqt install-qt ${{env.QT_HOST}} desktop ${{env.QT_VERSION}} ${{env.QT_ARCH}}
      - name: Try to build
        shell: cmd
        env:
          CMAKE_PREFIX_PATH: ${{github.workspace}}\${{env.QT_VERSION}}\${{env.QT_SPEC}}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --workflow --preset build